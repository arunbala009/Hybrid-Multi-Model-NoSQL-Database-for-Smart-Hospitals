# ==============================================================================
# Render Blueprint Configuration (render.yaml)
# Project: Hybrid Multi-Model NoSQL Database for Smart Hospitals
# Service: FastAPI RESTful Backend
# ==============================================================================

services:
  - type: web
    name: smart-hospital-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        value: c16ff73e
      - key: DEMO_SEED_TOKEN
        sync: false
      - key: CORS_ORIGINS
        value: "*"
